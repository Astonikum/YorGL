name: CI

on:
  push:
    branches:
      - main
      - "0.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yorgl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -DYORGL_BUILD_DX11=${{ matrix.os == 'windows-latest' && 'ON' || 'OFF' }} -DYORGL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  jvm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gradle: ./gradlew
          - os: windows-latest
            gradle: ./gradlew.bat
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ${{ matrix.gradle }} build --console=plain
